monitor = eDP-1, preferred, auto, 1, transform, 0
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
exec-once = waybar 
exec-once = hyprpaper
#exec-once = firefox
#exec-once = kitty
exec-once = mako
exec-once = nm-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = udiskie -t &

$terminal = kitty
$menu = rofi -show drun 
$fileManager = dolphin

# Auto-start terminals in workspaces 1-5
#exec-once = [workspace 1 silent] kitty
#exec-once = [workspace 2 silent] kitty
#exec-once = [workspace 3 silent] kitty
#exec-once = [workspace 4 silent] kitty
#exec-once = [workspace 5 silent] kitty
#exec-once = hyprctl dispatch workspace 1

# Check for updates on startup
exec-once = checkupdates > /tmp/neofetch_updates_cache 2>/dev/null

env = XDG_MENU_PREFIX,arch-

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 3
    col.active_border = rgb(bd93f9)
    col.inactive_border = rgb(44475a)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2
    active_opacity = 1
    inactive_opacity = 1
}

animations {
    enabled = no
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 0.94, almostLinear, fade
    animation = workspacesIn, 1, 0.21, almostLinear, fade
    animation = workspacesOut, 1, 0.94, almostLinear, fade
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}

dwindle {
    pseudotile = true 
    preserve_split = true
}

input {
    kb_layout = fr
    kb_variant = latin9
    kb_model = 
    kb_options =
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0.1
}

# Binds
bind = SUPER, Q, killactive,
bind = SUPER, M, exit,
bind = SUPER, X, togglefloating,
bind = SUPER, C, fullscreen,
bind = SUPER, L, exec, "/home/tuur/scripts/power.sh"
#bind = SUPER, P, 

bind = SUPER, A, exec, $terminal
bind = SUPER, Space, exec, $menu
bind = SUPER, E, exec, $fileManager
bind = SUPER, F, exec, firefox
bind = SUPER, V, exec, code
bind = , 110, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%s).png

# Move focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Resize windows
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Multimedia keys for volume and brightness
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , 232, exec, ~/.config/hypr/scripts/brightness-down.sh
bind = , 233, exec, brightnessctl set 10%+

# Switch to workspace
bind = SUPER, 10, workspace, 1
bind = SUPER, 11, workspace, 2
bind = SUPER, 12, workspace, 3
bind = SUPER, 13, workspace, 4
bind = SUPER, 14, workspace, 5

# Move to workspace
bind = SUPER SHIFT, 10, movetoworkspace, 1
bind = SUPER SHIFT, 11, movetoworkspace, 2
bind = SUPER SHIFT, 12, movetoworkspace, 3
bind = SUPER SHIFT, 13, movetoworkspace, 4
#bind = SUPER SHIFT, 14, movetoworkspace, 5

bind = SUPER SHIFT, 14, exec, /home/tuur/.config/waybar/scripts/close_workspace.sh 5

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Fix programs to workspaces
windowrulev2 = workspace 5, class:^(Spotify)$
